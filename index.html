<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Document</title>
    <script src = "./javascript js" defer></script>
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div class = "header">
        <span>Welcome to the game!!!</span>
    </div>

    <div class = "instruction">
        <span>Choose any of the options</span>
    </div>

    <div class = "buttons">
      
      <div class = "rock">
        <button>
          <img src="./images/rockPaw.png" alt="Rock Button">
          <span>ROCK</span>
        </button>
      </div>
      <div class = "paper">
        <button>
          <img src="./images/paperPaw.png" alt="Paper Button">
          <span>PAPER</span>
        </button>
      </div>
      <div class = "scissors">
        <button class ="scissors">
          <img src="./images/scissorsPaw.png" alt="scissors">
          <span>SCISSORS</span>
        </button>
      </div>

    </div>

    
</body>
</html>
